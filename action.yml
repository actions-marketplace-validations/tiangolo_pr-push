name: Get PR Push token
author: Sebastián Ramírez <tiangolo@gmail.com>
description: Get a short-lived, repository-scoped PR Push token.
inputs:
  url:
    description: URL of the deployed PR Push service.
    default: https://pr-push.fastapicloud.dev
outputs:
  token:
    description: GitHub App installation token.
runs:
  using: docker
  image: Dockerfile
branding:
  icon: git-commit
  color: blue
